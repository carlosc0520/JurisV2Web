<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <!-- SEO por defecto: lo que ven quienes no ejecutan JavaScript (WhatsApp, LinkedIn, Bing).
       En el navegador, src/composables/useSeo.js lo reemplaza con los datos de cada página. -->
  <meta name="description" content="Plataforma especializada de búsqueda jurídica del Perú. Jurisprudencia, doctrina y legislación actualizada." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#1864ff" />
  <meta property="og:site_name" content="Juris Search" />
  <meta property="og:title" content="Juris Search | Búsqueda jurídica del Perú" />
  <meta property="og:description" content="Plataforma especializada de búsqueda jurídica del Perú. Jurisprudencia, doctrina y legislación actualizada." />
  <meta property="og:image" content="https://jurissearch.com/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_PE" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="<%= BASE_URL %>logo.ico">
  <link rel="shortcut icon" href="<%= BASE_URL %>logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap"
    rel="stylesheet">
  <title>Juris Search | Búsqueda jurídica del Perú</title>
</head>

<body style="background-color: #FFF !important; font-family: 'Montserrat', sans-serif;" class="antialiased">
  <noscript>
    <strong>Juris Search necesita JavaScript para funcionar. Actívalo en tu navegador para continuar.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
  <!-- build-marker: 2026-07-13 -->
  <script src="https://checkout.culqi.com/js/v4"></script>
</body>

</html>
